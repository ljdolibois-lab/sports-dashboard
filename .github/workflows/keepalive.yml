name: Keep schedules alive

# GitHub automatically disables scheduled workflows in a public repo after
# 60 days with no commit activity. This repo's commits are rare (the daily
# brief deploys to Pages but never commits), so without this the "Daily sports
# brief" schedule would quietly pause after ~2 months.
#
# This job runs weekly and makes ONE empty commit, but only when the newest
# commit is old enough to be at risk. In practice that's roughly once every
# ~50 days — enough to keep the timer fresh, with minimal history noise. Any
# real push (yours or mine) resets the clock too, so it often does nothing.
#
# Self-contained on purpose: no third-party actions, just git + the built-in
# token. A commit pushed with GITHUB_TOKEN does not trigger other workflows,
# and the daily brief only runs on its own schedule / manual dispatch, so this
# can never cause a build loop.

on:
  schedule:
    - cron: "23 7 * * 1"      # Mondays 07:23 UTC (offset from the busy top of the hour)
  workflow_dispatch:
    inputs:
      force:
        description: "Commit now even if the repo was recently active (for testing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need full history to read the last commit date

      - name: Empty commit if the repo has been quiet
        run: |
          set -euo pipefail
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "Newest commit is ${age_days} day(s) old (auto-disable happens at 60)."

          if [ "$age_days" -ge 50 ] || [ "${{ inputs.force }}" = "true" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive — keep the daily brief's schedule active"
            git push
            echo "Pushed a keepalive commit; the 60-day inactivity timer is reset."
          else
            echo "Repo is active enough — nothing to do."
          fi
