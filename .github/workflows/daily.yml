name: Daily sports brief

on:
  schedule:
    # Goal: land in the inbox around 7am Central.
    #
    # GitHub's free scheduler is best-effort and — for this repo — has been
    # firing scheduled runs about 2h15m LATE (observed 2026-07-30 and -31: the
    # old 12:15 UTC slot didn't actually start until ~14:30 UTC, so email hit
    # at ~9:30am Central). So don't schedule at the target time; schedule early
    # to absorb the delay, and use an odd, off-peak minute — congestion is
    # worst at :00/:15/:30/:45.
    #
    #   10:07 UTC + ~2h15m typical delay  ≈ 12:22 UTC ≈ 7:22am Central (CDT)
    #
    # If GitHub ever runs it on time, it arrives ~5am — still waiting for you at
    # breakfast, which is fine for a page about yesterday. No timezone/DST, so
    # winter drifts an hour earlier. Exact-minute delivery isn't possible on a
    # free scheduler; that would need an external trigger hitting the API.
    - cron: "7 10 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.digest.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build dashboard
        run: |
          # --fail-if-empty is the whole point of automating this. Without it a
          # broken parser produces a clean, pretty, empty page and you read
          # stale results for a week without noticing.
          python -m src.main --fail-if-empty

      - name: Prepare Pages output
        run: |
          cp out/dashboard.html out/index.html
          # Stop Pages' Jekyll processing from mangling the file.
          touch out/.nojekyll

      - name: One-line digest for the email subject
        id: digest
        run: |
          # The build writes a news-first subject line (lead headline, not
          # player names) to mail/email_subject.txt. printf %s avoids the shell
          # re-interpreting any $ or ` in a headline.
          subject=$(cat mail/email_subject.txt)
          printf 'summary=%s\n' "$subject" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Email the dashboard
        # Never block the deploy on the mailer. A dead SMTP credential should
        # not stop the page from publishing.
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Sports Brief
          to: ${{ secrets.MAIL_TO }}
          subject: "Sports Brief — ${{ steps.digest.outputs.summary }}"
          # The compact catch-up digest, not the whole page: headlines + a few
          # notable scores + links back to the dashboard.
          html_body: file://mail/email.html
          convert_markdown: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
