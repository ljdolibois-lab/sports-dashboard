name: Daily sports brief

on:
  schedule:
    # 12:15 UTC. GitHub cron has no timezone and no DST, so this lands at
    # 7:15am Central in summer and 6:15am Central in winter. For a page about
    # yesterday, drifting an hour earlier is harmless.
    #
    # Note: GitHub's scheduler is best-effort and routinely runs 5-20 minutes
    # late under load, and occasionally skips a slot entirely. Fine here. If
    # you ever need punctuality, this is the wrong host.
    - cron: "15 12 * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.digest.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build dashboard
        run: |
          # --fail-if-empty is the whole point of automating this. Without it a
          # broken parser produces a clean, pretty, empty page and you read
          # stale results for a week without noticing.
          python -m src.main --fail-if-empty

      - name: Prepare Pages output
        run: |
          cp out/dashboard.html out/index.html
          # Stop Pages' Jekyll processing from mangling the file.
          touch out/.nojekyll

      - name: One-line digest for the email subject
        id: digest
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re, pathlib
          html = pathlib.Path("out/dashboard.html").read_text()
          names = re.findall(r'<div class="pname">([^<]+)</div>', html)
          games = len(re.findall(r'class="game"', html))
          top = ", ".join(names[:3]) if names else "no standouts"
          print(f"summary={games} finals · {top}")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Email the dashboard
        # Never block the deploy on the mailer. A dead SMTP credential should
        # not stop the page from publishing.
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Sports Brief
          to: ${{ secrets.MAIL_TO }}
          subject: "Sports Brief — ${{ steps.digest.outputs.summary }}"
          html_body: file://out/dashboard.html
          convert_markdown: false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
